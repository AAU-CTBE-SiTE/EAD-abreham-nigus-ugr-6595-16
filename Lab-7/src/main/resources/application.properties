spring.application.name=actor-management
server.port=8081

# ── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/actor_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Use environment variable: export DB_PASSWORD=your_password
spring.datasource.password=${DB_PASSWORD:HERMI1997}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Explicit dialect for MySQL + Hibernate 6
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Pagination defaults ──────────────────────────────────────────────────────
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
